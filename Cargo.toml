[package]
name = "seven-zero-ipda"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# ... keep your existing dependencies (chrono, rand)
[dependencies]

rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
js-sys = "0.3"
regex = "1"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
